name: CI - Go Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify go fix modernizers
        run: |
          go fix ./...
          if ! git diff --quiet; then
            echo "::error::go fix produced changes. Run 'go fix ./...' locally and commit the result."
            git diff
            exit 1
          fi

      - name: Run tests and report results
        uses: robherley/go-test-action@v0
        with:
          test-command: go test -v ./...

