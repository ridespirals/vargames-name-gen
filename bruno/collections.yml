info:
  name: collections
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/collections"
  headers:
    - name: Client-Id
      value: "{{client_id}}"
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: text
    data: fields *, games.name, games.summary;
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
