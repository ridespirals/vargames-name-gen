info:
  name: games
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/games"
  headers:
    - name: Client-Id
      value: "{{client_id}}"
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Body
      value: fields *;
  body:
    type: text
    data: fields *;
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
