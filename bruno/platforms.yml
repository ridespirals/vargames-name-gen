info:
  name: platforms
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/platforms"
  headers:
    - name: Client-Id
      value: "{{client_id}}"
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: text
    data: |-
      fields *, platform_type.name, websites.trusted, websites.url;
      limit 100;
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
