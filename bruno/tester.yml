info:
  name: tester
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/entity_types"
  headers:
    - name: Client-Id
      value: "{{client_id}}"
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: text
    data: |-
      fields *;

      limit {{max_limit}};
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
