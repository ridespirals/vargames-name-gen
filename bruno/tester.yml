info:
  name: tester
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/reports"
  headers:
    - name: Client-Id
      value: "{{client_id}}"
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: text
    data: |
      fields *, report_type.*, entity_type.*, source_item_id, target_item_id;
      limit 100;;q
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
